name: Test & Publish to CurseForge & Modrinth

on:
  push:
    branches:
      - main
    paths:
      - 'gradle.properties'
      - 'src/**'
      - 'CHANGELOG.md'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extrair Metadados do Mod
        id: get_metadata
        run: |
          MOD_NAME=$(grep "^mod_name=" gradle.properties | cut -d'=' -f2 | tr -d '\r' | tr -d ' ')
          if [ -z "$MOD_NAME" ]; then
            MOD_NAME="SandStorm"
          fi

          VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2 | tr -d '\r' | tr -d ' ')

          MC_VERSION=$(grep "^minecraft_target_version=" gradle.properties | cut -d'=' -f2 | tr -d '\r' | tr -d ' ')
          if [ -z "$MC_VERSION" ] || [ "$MC_VERSION" = "26.3" ]; then
            MC_VERSION="1.21.4"
          fi

          LOADER=$(grep "^mod_loader=" gradle.properties | cut -d'=' -f2 | tr -d '\r' | tr -d ' ')
          if [ -z "$LOADER" ]; then
            LOADER="Fabric"
          fi
          LOADER_LOWER=$(echo "$LOADER" | tr '[:upper:]' '[:lower:]')

          JAVA_VERSION=$(grep "^java_version=" gradle.properties | cut -d'=' -f2 | tr -d '\r' | tr -d ' ')
          if [ -z "$JAVA_VERSION" ]; then
            JAVA_VERSION="25"
          fi

          RELEASE_TITLE="$MOD_NAME $VERSION ($LOADER $MC_VERSION)"

          echo "MOD_NAME=$MOD_NAME" >> $GITHUB_ENV
          echo "MOD_VERSION=$VERSION" >> $GITHUB_ENV
          echo "MC_VERSION=$MC_VERSION" >> $GITHUB_ENV
          echo "MOD_LOADER=$LOADER" >> $GITHUB_ENV
          echo "MOD_LOADER_LOWER=$LOADER_LOWER" >> $GITHUB_ENV
          echo "JAVA_VERSION=$JAVA_VERSION" >> $GITHUB_ENV
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> $GITHUB_ENV

          echo "=========================================="
          echo "Metadados detectados dinamicamente:"
          echo " - Mod: $MOD_NAME"
          echo " - Versão do Mod: $VERSION"
          echo " - Loader: $LOADER ($LOADER_LOWER)"
          echo " - Minecraft: $MC_VERSION"
          echo " - Java: $JAVA_VERSION"
          echo " - Título da Release: $RELEASE_TITLE"
          echo "=========================================="

      - name: Checar se a versão foi incrementada (Tag existe?)
        id: check_tag
        run: |
          if git rev-parse "refs/tags/v${{ env.MOD_VERSION }}" >/dev/null 2>&1; then
            echo "A versão v${{ env.MOD_VERSION }} já existe no histórico/tags. Nenhuma publicação necessária."
            echo "publish=false" >> $GITHUB_OUTPUT
          else
            echo "Nova versão detectada: v${{ env.MOD_VERSION }}! Prosseguindo com testes e publicação."
            echo "publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Configurar Java 25
        if: steps.check_tag.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Ajustar ambiente Gradle para CI
        if: steps.check_tag.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties

      - name: Permissão de execução para gradlew
        if: steps.check_tag.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        run: chmod +x ./gradlew

      - name: Executar Testes
        if: steps.check_tag.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        run: ./gradlew test --no-daemon

      - name: Compilar Mod (Jar)
        if: steps.check_tag.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        run: ./gradlew build --no-daemon

      - name: Extrair Changelog da Versão
        if: steps.check_tag.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python3 -c "
          import re, os
          version = os.environ.get('MOD_VERSION', '')
          changelog = ''
          if os.path.exists('CHANGELOG.md'):
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  text = f.read()
              pattern = rf'## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)'
              match = re.search(pattern, text, re.DOTALL)
              if match:
                  changelog = match.group(1).strip()
                  changelog = re.sub(r'\n---\s*$', '', changelog).strip()
          if not changelog:
              changelog = f'Release v{version} de SandStorm para Minecraft {os.environ.get(\"MC_VERSION\", \"1.21.4\")} ({os.environ.get(\"MOD_LOADER\", \"Fabric\")}).'
          with open('RELEASE_CHANGELOG.md', 'w', encoding='utf-8') as out:
              out.write(changelog)
          "
          echo "=========================================="
          echo "Changelog Gerado para CurseForge ($MOD_VERSION):"
          cat RELEASE_CHANGELOG.md
          echo "=========================================="

      - name: Publicar no CurseForge
        if: (steps.check_tag.outputs.publish == 'true' || github.event_name == 'workflow_dispatch') && (secrets.CURSEFORGE_TOKEN != '')
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID || '1713742' }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: |
            build/libs/*-${{ env.MOD_VERSION }}.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          name: ${{ env.RELEASE_TITLE }}
          version: ${{ env.MOD_VERSION }}
          version-type: 'release'
          changelog-file: 'RELEASE_CHANGELOG.md'
          game-versions: |
            ${{ env.MC_VERSION }}
          loaders: |
            ${{ env.MOD_LOADER_LOWER }}
          java: |
            Java 25
            Java 21
          fail-mode: 'fail'

      - name: Publicar no Modrinth
        if: (steps.check_tag.outputs.publish == 'true' || github.event_name == 'workflow_dispatch') && (secrets.MODRINTH_TOKEN != '' || vars.MODRINTH_TOKEN != '')
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID || vars.MODRINTH_PROJECT_ID || 'sandstorm-felipehonorio55' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN || vars.MODRINTH_TOKEN }}
          files: |
            build/libs/*-${{ env.MOD_VERSION }}.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          name: ${{ env.RELEASE_TITLE }}
          version: ${{ env.MOD_VERSION }}
          version-type: 'release'
          changelog-file: 'RELEASE_CHANGELOG.md'
          game-versions: |
            ${{ env.MC_VERSION }}
            26.3
            26.2
          loaders: |
            ${{ env.MOD_LOADER_LOWER }}
          java: |
            Java 25
            Java 21
          fail-mode: 'warn'

      - name: Criar Tag Git para a Nova Versão
        if: (steps.check_tag.outputs.publish == 'true' || github.event_name == 'workflow_dispatch') && success()
        run: |
          if git rev-parse "refs/tags/v${{ env.MOD_VERSION }}" >/dev/null 2>&1; then
            echo "Tag v${{ env.MOD_VERSION }} já existe. Pulando criação de tag."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "v${{ env.MOD_VERSION }}" -m "Release v${{ env.MOD_VERSION }}"
            git push origin "v${{ env.MOD_VERSION }}"
          fi
